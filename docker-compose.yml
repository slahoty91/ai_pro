services:
  mongodb:
    image: mongo:7
    container_name: ai_pro_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=extractor_db
    networks:
      - ai_pro_network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ai_pro_qdrant
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - ai_pro_network
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_pro_app
    ports:
      - "8080:8080"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MONGODB_URI=mongodb://mongodb:27017
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6334
    depends_on:
      mongodb:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - ai_pro_network
    volumes:
      - ./extraction_files:/app/extraction_files:ro

volumes:
  mongodb_data:
  qdrant_data:

networks:
  ai_pro_network:
    driver: bridge

